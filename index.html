<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="That 2 Minutes">
<meta name="theme-color" content="#07090d">
<title>That 2 Minutes</title>

<style>
:root{--green:#35ff4c;--blue:#29a7ff;--panel:rgba(8,10,14,.84);--text:#fff;--muted:#b9bec7}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#07090d;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}

body{
background-image:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.62)),url('family-bg.jpg');
background-size:cover;
background-position:center top;
background-attachment:fixed
}

.app{width:min(980px,96vw);margin:0 auto;padding:18px 0 40px}

.hero{
margin:10px auto 18px;
max-width:760px;
padding:14px 18px;
border-radius:20px;
background:rgba(0,0,0,.42);
backdrop-filter:blur(5px);
text-align:center;
border:1px solid rgba(255,255,255,.16)
}

.hero h1{margin:0;font-size:clamp(34px,8vw,72px);line-height:.95;font-weight:1000;text-shadow:0 4px 18px #000}
.hero .two{color:#ffd91a}
.hero .minutes{color:#168cff}
.hero p{margin:7px 0 0;font-weight:800}

.panel{
background:var(--panel);
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,.16);
border-radius:24px;
box-shadow:0 18px 48px rgba(0,0,0,.42)
}

.timer-panel{max-width:560px;margin:0 auto;padding:20px;text-align:center}
.phase{font-size:15px;font-weight:1000;letter-spacing:.14em;color:var(--green)}

.time{
font-size:clamp(82px,18vw,138px);
line-height:1;
font-weight:1000;
color:var(--green);
text-shadow:0 0 24px rgba(53,255,76,.25);
font-variant-numeric:tabular-nums
}

.exercise{font-size:25px;font-weight:900;margin-top:6px}
.round{font-size:18px;color:#e8e8e8;margin:5px 0 14px}

.progress{height:13px;background:#34383f;border-radius:999px;overflow:hidden}
.progress>div{height:100%;width:100%;background:linear-gradient(90deg,#24f444,#88ff38)}

.upnext{margin-top:10px;color:var(--blue);font-weight:900}

.controls{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin:16px auto 0;
max-width:660px
}

button{
border:0;
border-radius:16px;
padding:15px 16px;
font-size:18px;
font-weight:1000;
cursor:pointer
}

.start{background:linear-gradient(#48ef32,#28b922);color:white}
.pause{background:#303238;color:white}
.reset{background:linear-gradient(#eb4747,#b82727);color:white}
.controls .reset{grid-column:1/-1}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:14px;
margin-top:16px
}

.settings{padding:16px}
.settings h2,.youtube h2{margin:0 0 12px;font-size:19px}

label{
display:block;
font-size:13px;
color:var(--muted);
margin:9px 0 5px;
text-align:left
}

input,select{
width:100%;
padding:12px 13px;
border-radius:12px;
border:1px solid #444a55;
background:#11151b;
color:#fff;
font-size:16px
}

.smallrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.exercise-list{max-height:290px;overflow:auto;padding-right:3px}
.exercise-list input{margin-bottom:7px}

.test{
width:100%;
margin-top:10px;
background:#6f36d8;
color:white
}

.youtube{margin-top:16px;padding:16px}
.ytrow{display:grid;grid-template-columns:1fr auto;gap:10px}
.load{background:#e92525;color:#fff}

.video{
margin-top:12px;
aspect-ratio:16/9;
background:#000;
border-radius:16px;
overflow:hidden
}

.video iframe{width:100%;height:100%;border:0}

.celebrate{
position:fixed;
inset:0;
background:rgba(3,5,8,.93);
z-index:1000;
display:none;
align-items:center;
justify-content:center;
text-align:center;
overflow:hidden;
padding:24px
}

.celebrate.show{display:flex}
.celebrateBox{position:relative;z-index:1002;max-width:720px}
.trophy{font-size:90px}

.bigmsg{
font-size:clamp(40px,10vw,90px);
font-weight:1000;
line-height:.95
}

.bigmsg .a{color:#ffd327}
.bigmsg .b{color:#33ddff}

.doneText{font-size:25px;font-weight:900;margin:14px 0 22px}
.awesome{background:#36df42;color:#061108;min-width:220px}

.confetti{
position:fixed;
bottom:-30px;
width:10px;
height:18px;
z-index:1001;
animation:fly linear forwards
}

@keyframes fly{
0%{transform:translateY(0) rotate(0deg);opacity:1}
100%{transform:translateY(-115vh) rotate(900deg);opacity:.8}
}

@media(max-width:760px){
.grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="app">

<div class="hero">
<h1>THAT <span class="two">2</span> <span class="minutes">MINUTES</span></h1>
<p>STRONGER TOGETHER. EVERY DAY. ❤️</p>
</div>

<div class="panel timer-panel">
<div id="phase" class="phase">WORK TIME</div>
<div id="time" class="time">02:00</div>
<div id="exercise" class="exercise">Exercise 1</div>
<div id="round" class="round">Round 1 of 3</div>

<div class="progress"><div id="bar"></div></div>

<div id="upnext" class="upnext">
UP NEXT: REST 00:30
</div>
</div>

<div class="controls">
<button id="startBtn" class="start">▶ START</button>
<button id="pauseBtn" class="pause">Ⅱ PAUSE</button>
<button id="resetBtn" class="reset">↻ RESET</button>
</div>

<div class="grid">

<div class="panel settings">
<h2>⏱ Timer Settings</h2>

<div class="smallrow">
<div>
<label>Work minutes</label>
<input id="workMin" type="number" min="0" max="180" value="2">
</div>

<div>
<label>Work seconds</label>
<input id="workSec" type="number" min="0" max="59" value="0">
</div>
</div>

<div class="smallrow">
<div>
<label>Rest minutes</label>
<input id="restMin" type="number" min="0" max="60" value="0">
</div>

<div>
<label>Rest seconds</label>
<input id="restSec" type="number" min="0" max="59" value="30">
</div>
</div>

<label>Rounds (1–99)</label>
<input id="rounds" type="number" min="1" max="99" value="3">

<button id="applyBtn" class="test">
Apply Timer Settings
</button>
</div>

<div class="panel settings">

<h2>🎵 Round-End Motivation</h2>

<label>Sound / voice</label>

<select id="soundChoice">
<option value="drum">🥁 Drum beat motivation</option>
<option value="onedown">🗣 “One down!”</option>
<option value="youcandoit">💪 “You can do it!”</option>
<option value="chime">🔔 Victory chime</option>
<option value="random">🎲 Random each round</option>
</select>

<label>Voice volume</label>

<input id="voiceVolume"
type="range"
min="0"
max="1"
step="0.05"
value="1">

<button id="testBtn" class="test">
🔊 Test Selected Sound
</button>

</div>

<div class="panel settings">

<h2>✏️ Exercise Names</h2>

<div id="exerciseList" class="exercise-list"></div>

</div>

</div>

<div class="panel youtube">

<h2>▶️ Watch YouTube While You Train</h2>

<div class="ytrow">

<input id="youtubeURL"
placeholder="Paste YouTube link here">

<button id="loadYT" class="load">
LOAD
</button>

</div>

<div class="video">

<iframe
id="youtubePlayer"
title="YouTube player"
allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
allowfullscreen>
</iframe>

</div>
</div>
</div>

<div id="celebrate" class="celebrate">

<div class="celebrateBox">

<div class="trophy">🏆🎉</div>

<div class="bigmsg">
<span class="a">THAT 2 MINUTES!!!</span>
<br>
<span class="b">YAHOOOOO!</span>
</div>

<div class="doneText">
AMAZING WORK! YOU DID IT! 👏
</div>

<button id="closeCelebrate" class="awesome">
Awesome! 🙌
</button>

</div>
</div>

<script>

let workSeconds=120;
let restSeconds=30;
let totalRounds=3;
let round=1;
let mode="work";
let seconds=120;
let running=false;
let timerId=null;
let ctx=null;

const $=id=>document.getElementById(id);

const timeEl=$("time");
const phaseEl=$("phase");
const exerciseEl=$("exercise");
const roundEl=$("round");
const bar=$("bar");
const upnext=$("upnext");

function fmt(n){
n=Math.max(0,Math.floor(n));

return String(Math.floor(n/60)).padStart(2,"0")
+":"+String(n%60).padStart(2,"0");
}

function audio(){

if(!ctx){
const AC=window.AudioContext||window.webkitAudioContext;
ctx=new AC();
}

if(ctx.state==="suspended")ctx.resume();

return ctx;
}

function tone(freq,start,dur,vol=.16,type="triangle"){

const c=audio();
const o=c.createOscillator();
const g=c.createGain();

o.type=type;
o.frequency.value=freq;

g.gain.setValueAtTime(.001,c.currentTime+start);

g.gain.exponentialRampToValueAtTime(
vol,
c.currentTime+start+.02
);

g.gain.exponentialRampToValueAtTime(
.001,
c.currentTime+start+dur
);

o.connect(g);
g.connect(c.destination);

o.start(c.currentTime+start);
o.stop(c.currentTime+start+dur+.05);
}

function drumBeat(){

const c=audio();

[0,.18,.36,.54].forEach((d,i)=>{

const o=c.createOscillator();
const g=c.createGain();

o.type="sine";

o.frequency.setValueAtTime(
120-i*12,
c.currentTime+d
);

o.frequency.exponentialRampToValueAtTime(
52,
c.currentTime+d+.14
);

g.gain.setValueAtTime(
.28,
c.currentTime+d
);

g.gain.exponentialRampToValueAtTime(
.001,
c.currentTime+d+.16
);

o.connect(g);
g.connect(c.destination);

o.start(c.currentTime+d);
o.stop(c.currentTime+d+.18);

});

tone(660,.70,.12,.12);
tone(880,.82,.22,.14);

}

function victoryChime(){

tone(523,0,.18,.12);
tone(659,.15,.18,.13);
tone(784,.30,.18,.14);
tone(1046,.48,.38,.16);

}

function speak(text){

if(!("speechSynthesis" in window))return;

speechSynthesis.cancel();

const u=new SpeechSynthesisUtterance(text);

u.rate=1;
u.pitch=1.08;
u.volume=parseFloat(
$("voiceVolume").value||"1"
);

speechSynthesis.speak(u);
}

function playRoundMotivation(){

let c=$("soundChoice").value;

if(c==="random")

c=[
"drum",
"onedown",
"youcandoit",
"chime"
][Math.floor(Math.random()*4)];

if(c==="drum")drumBeat();

if(c==="onedown")
speak("One down!");

if(c==="youcandoit")
speak("You can do it!");

if(c==="chime")
victoryChime();

}

function restDone(){

tone(720,0,.13,.12,"square");
tone(980,.17,.20,.14,"triangle");

}

function clap(delay){

const c=audio();

const len=Math.floor(c.sampleRate*.11);

const buf=c.createBuffer(
1,
len,
c.sampleRate
);

const d=buf.getChannelData(0);

for(let i=0;i<len;i++)

d[i]=
(Math.random()*2-1)
*Math.pow(1-i/len,3);

const s=c.createBufferSource();
const f=c.createBiquadFilter();
const g=c.createGain();

s.buffer=buf;

f.type="bandpass";
f.frequency.value=1700;

g.gain.value=.16;

s.connect(f);
f.connect(g);
g.connect(c.destination);

s.start(c.currentTime+delay);

}

function finalSound(){

victoryChime();

for(let i=0;i<22;i++)

clap(
.12+i*.09+Math.random()*.04
);

setTimeout(
()=>speak(
"That 2 Minutes!!! Yahooooo!"
),
450
);

}

function createConfetti(){

const colors=[
"#ff3b30",
"#ffd60a",
"#34c759",
"#0a84ff",
"#bf5af2",
"#ff9f0a",
"#fff"
];

for(let i=0;i<160;i++){

const p=document.createElement("div");

p.className="confetti";

p.style.left=
Math.random()*100+"vw";

p.style.background=
colors[
Math.floor(
Math.random()*colors.length
)
];

p.style.animationDuration=
(2.3+Math.random()*3.1)+"s";

p.style.animationDelay=
Math.random()*1.2+"s";

document.body.appendChild(p);

setTimeout(
()=>p.remove(),
6500
);

}

}

function exerciseName(){

return (
$("ex"+round)?.value
||
"Exercise "+round
);

}

function renderExercises(){

const wrap=$("exerciseList");

const current={};

wrap.querySelectorAll("input")
.forEach(i=>current[i.id]=i.value);

wrap.innerHTML="";

for(let i=1;i<=totalRounds;i++){

const inp=document.createElement("input");

inp.id="ex"+i;
inp.placeholder="Exercise "+i;

inp.value=
current[inp.id]
||
localStorage.getItem(
"t2m_ex"+i
)
||
"Exercise "+i;

inp.addEventListener(
"input",
()=>{

localStorage.setItem(
"t2m_ex"+i,
inp.value
);

display();

}
);

wrap.appendChild(inp);

}

}

function display(){

timeEl.textContent=fmt(seconds);

exerciseEl.textContent=
exerciseName();

roundEl.textContent=
"Round "+round+" of "+totalRounds;

const total=
mode==="work"
?workSeconds
:restSeconds;

bar.style.width=
(total
?seconds/total*100
:0)+"%";

if(mode==="work"){

phaseEl.textContent="WORK TIME";

phaseEl.style.color=
"var(--green)";

timeEl.style.color=
"var(--green)";

upnext.textContent=
"UP NEXT: REST "
+fmt(restSeconds);

}else{

phaseEl.textContent="REST";

phaseEl.style.color=
"var(--blue)";

timeEl.style.color=
"var(--blue)";

upnext.textContent=
round<totalRounds
?
"UP NEXT: "
+(
$("ex"+(round+1))?.value
||
("Exercise "+(round+1))
)
:
"FINAL ROUND COMPLETE NEXT";

}

}

function nextPhase(){

if(mode==="work"){

playRoundMotivation();

if(round>=totalRounds){

finish();
return;

}

mode="rest";
seconds=restSeconds;

if(restSeconds===0){

round++;
mode="work";
seconds=workSeconds;

}

}else{

restDone();

round++;

mode="work";
seconds=workSeconds;

}

display();

}

function finish(){

clearInterval(timerId);

timerId=null;
running=false;
seconds=0;

display();

phaseEl.textContent="DONE";

phaseEl.style.color="#ffd60a";
timeEl.style.color="#ffd60a";

exerciseEl.textContent=
"Workout Complete!";

upnext.textContent=
"THAT 2 MINUTES!!! YAHOOOOO!";

$("celebrate")
.classList.add("show");

createConfetti();

finalSound();

}

function tick(){

seconds--;

if(seconds<=0){

seconds=0;

display();

nextPhase();

}else{

display();

}

}

function startTimer(){

audio();

if(!running){

running=true;

timerId=setInterval(
tick,
1000
);

}

}

function pauseTimer(){

if(running){

clearInterval(timerId);

timerId=null;
running=false;

}

}

function resetTimer(){

pauseTimer();

round=1;
mode="work";
seconds=workSeconds;

$("celebrate")
.classList.remove("show");

display();

}

function applySettings(){

pauseTimer();

const wm=
Math.max(
0,
parseInt(
$("workMin").value
)||0
);

const ws=
Math.min(
59,
Math.max(
0,
parseInt(
$("workSec").value
)||0
)
);

const rm=
Math.max(
0,
parseInt(
$("restMin").value
)||0
);

const rs=
Math.min(
59,
Math.max(
0,
parseInt(
$("restSec").value
)||0
)
);

workSeconds=
wm*60+ws;

restSeconds=
rm*60+rs;

totalRounds=
Math.min(
99,
Math.max(
1,
parseInt(
$("rounds").value
)||1
)
);

if(workSeconds<1){

alert(
"Work time must be at least 1 second."
);

return;

}

localStorage.setItem(
"t2m_settings",
JSON.stringify({
wm,
ws,
rm,
rs,
r:totalRounds,
s:$("soundChoice").value,
v:$("voiceVolume").value
})
);

round=1;
mode="work";
seconds=workSeconds;

renderExercises();

display();

}

function youtubeID(url){

try{

const u=new URL(url);

if(
u.hostname.includes("youtu.be")
)

return u.pathname
.slice(1)
.split("?")[0];

if(u.searchParams.get("v"))

return u.searchParams.get("v");

const p=u.pathname.split("/");

for(
const key of [
"embed",
"shorts"
]
){

const i=p.indexOf(key);

if(i>=0&&p[i+1])

return p[i+1];

}

}catch(e){}

return null;

}

function loadYT(){

const url=
$("youtubeURL")
.value
.trim();

const id=
youtubeID(url);

if(!id){

alert(
"Please paste a valid YouTube link."
);

return;

}

$("youtubePlayer").src=
"https://www.youtube.com/embed/"
+id+
"?playsinline=1&rel=0";

localStorage.setItem(
"t2m_youtube",
url
);

}

function restore(){

const s=
JSON.parse(
localStorage.getItem(
"t2m_settings"
)
||
"null"
);

if(s){

$("workMin").value=s.wm;
$("workSec").value=s.ws;

$("restMin").value=s.rm;
$("restSec").value=s.rs;

$("rounds").value=s.r;

$("soundChoice").value=
s.s||"drum";

$("voiceVolume").value=
s.v||1;

}

const yt=
localStorage.getItem(
"t2m_youtube"
);

if(yt){

$("youtubeURL").value=yt;

const id=youtubeID(yt);

if(id)

$("youtubePlayer").src=
"https://www.youtube.com/embed/"
+id+
"?playsinline=1&rel=0";

}

applySettings();

}

$("startBtn")
.addEventListener(
"click",
startTimer
);

$("pauseBtn")
.addEventListener(
"click",
pauseTimer
);

$("resetBtn")
.addEventListener(
"click",
resetTimer
);

$("applyBtn")
.addEventListener(
"click",
applySettings
);

$("testBtn")
.addEventListener(
"click",
()=>{

audio();
playRoundMotivation();

}
);

$("loadYT")
.addEventListener(
"click",
loadYT
);

$("closeCelebrate")
.addEventListener(
"click",
()=>
$("celebrate")
.classList.remove("show")
);

restore();

</script>

</body>
</html>
