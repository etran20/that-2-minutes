<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="That 2 Minutes">
<meta name="theme-color" content="#0b0b0f">

<title>That 2 Minutes</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at top,#202337 0,#0b0b0f 55%);
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  padding:20px;
  text-align:center;
  overflow-x:hidden;
}

.app{
  width:100%;
  max-width:600px;
  margin:auto;
}

h1{
  margin:10px 0 2px;
  font-size:34px;
}

.subtitle{
  color:#aaa;
  margin-bottom:18px;
}

.card{
  background:#17171e;
  border:1px solid #2b2b37;
  border-radius:26px;
  padding:20px;
  box-shadow:0 15px 40px rgba(0,0,0,.35);
}

.phase{
  font-weight:900;
  font-size:17px;
  letter-spacing:.12em;
  color:#4ade80;
}

.time{
  font-size:clamp(80px,22vw,125px);
  line-height:1;
  margin:10px 0;
  font-weight:900;
  font-variant-numeric:tabular-nums;
}

.exercise{
  font-size:27px;
  font-weight:800;
}

.round{
  color:#aaa;
  margin:8px 0 20px;
}

.progress{
  width:100%;
  height:11px;
  border-radius:20px;
  background:#30303a;
  overflow:hidden;
  margin-bottom:20px;
}

.progressFill{
  height:100%;
  width:100%;
  background:#4ade80;
  transition:width .3s linear;
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

button{
  border:0;
  border-radius:16px;
  padding:16px;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
}

.start{
  background:#4ade80;
  color:#06230f;
}

.reset{
  background:#33343d;
  color:white;
}

.soundTest{
  width:100%;
  margin-top:10px;
  background:#7c3aed;
  color:white;
}

.section{
  margin-top:22px;
  background:#17171e;
  border-radius:22px;
  padding:18px;
  border:1px solid #2b2b37;
}

.section h2{
  margin:0 0 12px;
  font-size:20px;
}

input{
  width:100%;
  margin:6px 0;
  padding:13px;
  border-radius:12px;
  border:1px solid #40404d;
  background:#0f0f14;
  color:white;
  font-size:16px;
}

.youtubeControls{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
}

.youtubeButton{
  background:#ff0033;
  color:white;
  padding:10px 16px;
}

.videoWrap{
  margin-top:12px;
  position:relative;
  width:100%;
  padding-top:56.25%;
  background:black;
  border-radius:16px;
  overflow:hidden;
}

.videoWrap iframe{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
}

.tip{
  color:#999;
  font-size:13px;
  margin-top:8px;
}

.celebration{
  position:fixed;
  inset:0;
  background:rgba(6,6,10,.92);
  z-index:5000;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  padding:25px;
  overflow:hidden;
}

.celebration.show{
  display:flex;
}

.trophy{
  font-size:85px;
  animation:bounce 1s infinite alternate;
}

.congrats{
  font-size:48px;
  margin:5px 0;
  font-weight:1000;
  background:linear-gradient(90deg,#fbbf24,#f472b6,#60a5fa,#4ade80);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.didIt{
  font-size:30px;
  font-weight:900;
}

.celebrateText{
  color:#ddd;
  font-size:18px;
  margin:10px 0 25px;
}

.closeCelebration{
  background:#4ade80;
  color:#06230f;
  min-width:210px;
  z-index:5100;
}

.confetti{
  position:fixed;
  width:12px;
  height:18px;
  top:-30px;
  z-index:5050;
  opacity:.95;
  animation:fall linear forwards;
}

@keyframes fall{
  0%{
    transform:translateY(-10vh) rotate(0deg);
  }
  100%{
    transform:translateY(115vh) rotate(900deg);
  }
}

@keyframes bounce{
  from{transform:scale(1) rotate(-4deg);}
  to{transform:scale(1.15) rotate(4deg);}
}

.restFlash{
  animation:flash .7s ease;
}

@keyframes flash{
  0%{transform:scale(1);}
  50%{transform:scale(1.08);}
  100%{transform:scale(1);}
}
</style>
</head>

<body>

<div class="app">

  <h1>That 2 Minutes</h1>
  <div class="subtitle">
    3 Exercises • 2:00 Work • 0:30 Rest
  </div>

  <div class="card">

    <div id="phase" class="phase">WORK</div>

    <div id="time" class="time">2:00</div>

    <div id="exercise" class="exercise">
      Exercise 1
    </div>

    <div id="round" class="round">
      Round 1 of 3
    </div>

    <div class="progress">
      <div id="progressFill" class="progressFill"></div>
    </div>

    <div class="buttons">
      <button id="startButton" class="start">
        Start
      </button>

      <button class="reset" onclick="resetTimer()">
        Reset
      </button>
    </div>

    <button class="soundTest" onclick="testSounds()">
      🔊 Test Fun Sounds
    </button>

  </div>


  <div class="section">

    <h2>🏋️ Exercise Names</h2>

    <input
      id="e1"
      value="Exercise 1"
      placeholder="Exercise 1">

    <input
      id="e2"
      value="Exercise 2"
      placeholder="Exercise 2">

    <input
      id="e3"
      value="Exercise 3"
      placeholder="Exercise 3">

  </div>


  <div class="section">

    <h2>▶️ Watch YouTube While Training</h2>

    <div class="youtubeControls">

      <input
        id="youtubeURL"
        placeholder="Paste YouTube link here">

      <button
        class="youtubeButton"
        onclick="loadYouTube()">
        Load
      </button>

    </div>

    <div class="videoWrap">

      <iframe
        id="youtubePlayer"
        title="YouTube Player"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>

    </div>

    <div class="tip">
      Paste a YouTube video link and press Load.
      The timer keeps running while you watch.
    </div>

  </div>

</div>


<div id="celebration" class="celebration">

  <div class="trophy">🏆</div>

  <div class="congrats">
    CONGRATULATIONS!
  </div>

  <div class="didIt">
    🎉 YOU DID IT! 🎉
  </div>

  <div class="celebrateText">
    You completed all 3 exercises!
  </div>

  <button
    class="closeCelebration"
    onclick="closeCelebration()">
    Awesome! 🙌
  </button>

</div>


<script>

const WORK = 120;
const REST = 30;
const TOTAL_ROUNDS = 3;

let round = 1;
let mode = "work";
let seconds = WORK;
let running = false;
let interval = null;
let audioContext = null;

const time =
document.getElementById("time");

const phase =
document.getElementById("phase");

const exercise =
document.getElementById("exercise");

const roundText =
document.getElementById("round");

const startButton =
document.getElementById("startButton");

const progressFill =
document.getElementById("progressFill");

const celebration =
document.getElementById("celebration");


function getAudioContext(){

  if(!audioContext){

    const AC =
      window.AudioContext ||
      window.webkitAudioContext;

    audioContext =
      new AC();

  }

  if(audioContext.state === "suspended"){
    audioContext.resume();
  }

  return audioContext;
}


function tone(
  frequency,
  start,
  duration,
  volume=.12,
  type="sine"
){

  const ctx = getAudioContext();

  const osc =
    ctx.createOscillator();

  const gain =
    ctx.createGain();

  osc.type = type;
  osc.frequency.value = frequency;

  gain.gain.setValueAtTime(
    0.001,
    ctx.currentTime + start
  );

  gain.gain.exponentialRampToValueAtTime(
    volume,
    ctx.currentTime + start + .02
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    ctx.currentTime + start + duration
  );

  osc.connect(gain);
  gain.connect(ctx.destination);

  osc.start(
    ctx.currentTime + start
  );

  osc.stop(
    ctx.currentTime + start + duration + .05
  );
}


function funRoundSound(){

  tone(523,.00,.18,.12,"triangle");
  tone(659,.16,.18,.12,"triangle");
  tone(784,.32,.22,.14,"triangle");
  tone(1046,.52,.40,.16,"triangle");

  if(navigator.vibrate){
    navigator.vibrate([100,80,100]);
  }
}


function restFinishedSound(){

  tone(660,.00,.16,.11,"square");
  tone(880,.18,.18,.12,"square");
  tone(1100,.38,.28,.13,"triangle");

  if(navigator.vibrate){
    navigator.vibrate(150);
  }
}


function clapBurst(delay){

  const ctx =
    getAudioContext();

  const bufferSize =
    ctx.sampleRate * .12;

  const buffer =
    ctx.createBuffer(
      1,
      bufferSize,
      ctx.sampleRate
    );

  const data =
    buffer.getChannelData(0);

  for(let i=0;i<bufferSize;i++){

    data[i] =
      (Math.random()*2-1) *
      Math.pow(1-i/bufferSize,3);

  }

  const source =
    ctx.createBufferSource();

  const filter =
    ctx.createBiquadFilter();

  const gain =
    ctx.createGain();

  source.buffer = buffer;

  filter.type = "bandpass";
  filter.frequency.value = 1600;
  filter.Q.value = .8;

  gain.gain.value = .18;

  source.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);

  source.start(
    ctx.currentTime + delay
  );
}


function celebrationSound(){

  tone(523,.00,.18,.12,"triangle");
  tone(659,.14,.18,.12,"triangle");
  tone(784,.28,.18,.13,"triangle");
  tone(1046,.42,.65,.16,"triangle");

  for(let i=0;i<18;i++){

    clapBurst(
      .15 +
      i*.11 +
      Math.random()*.07
    );

  }

  setTimeout(()=>{

    tone(784,0,.15,.13,"triangle");
    tone(1046,.15,.20,.15,"triangle");
    tone(1318,.35,.55,.17,"triangle");

  },1200);

}


function testSounds(){

  getAudioContext();

  funRoundSound();

  setTimeout(
    restFinishedSound,
    1300
  );

  setTimeout(
    celebrationSound,
    2600
  );

}


function exerciseName(){

  const element =
    document.getElementById(
      "e"+round
    );

  return element.value ||
    "Exercise "+round;
}


function display(){

  const minutes =
    Math.floor(seconds/60);

  const secs =
    seconds%60;

  time.textContent =
    minutes + ":" +
    String(secs).padStart(2,"0");

  exercise.textContent =
    exerciseName();

  roundText.textContent =
    "Round " +
    round +
    " of " +
    TOTAL_ROUNDS;

  const total =
    mode==="work"
    ? WORK
    : REST;

  const percent =
    (seconds/total)*100;

  progressFill.style.width =
    percent+"%";

  if(mode==="work"){

    phase.textContent =
      "WORK";

    phase.style.color =
      "#4ade80";

    progressFill.style.background =
      "#4ade80";

  }else{

    phase.textContent =
      "REST";

    phase.style.color =
      "#60a5fa";

    progressFill.style.background =
      "#60a5fa";

  }

}


function nextPhase(){

  if(mode==="work"){

    funRoundSound();

    mode="rest";
    seconds=REST;

    time.classList.remove(
      "restFlash"
    );

    void time.offsetWidth;

    time.classList.add(
      "restFlash"
    );

  }else{

    restFinishedSound();

    if(round === TOTAL_ROUNDS){

      finishWorkout();
      return;

    }

    round++;

    mode="work";
    seconds=WORK;

  }

  display();

}


function finishWorkout(){

  clearInterval(interval);

  interval=null;
  running=false;

  time.textContent="0:00";

  phase.textContent="DONE";

  phase.style.color="#fbbf24";

  exercise.textContent=
    "Workout Complete!";

  roundText.textContent=
    "3 of 3 completed";

  progressFill.style.width=
    "100%";

  startButton.textContent=
    "Start Again";

  celebration.classList.add(
    "show"
  );

  createConfetti();

  celebrationSound();

  if(navigator.vibrate){

    navigator.vibrate(
      [150,80,150,80,300]
    );

  }

}


startButton.onclick =
function(){

  getAudioContext();

  if(
    phase.textContent === "DONE"
  ){

    resetTimer();

  }

  if(running){

    clearInterval(interval);

    interval=null;
    running=false;

    startButton.textContent=
      "Resume";

  }else{

    running=true;

    startButton.textContent=
      "Pause";

    interval =
      setInterval(()=>{

        seconds--;

        if(seconds <= 0){

          seconds=0;
          display();
          nextPhase();

        }else{

          display();

        }

      },1000);

  }

};


function resetTimer(){

  clearInterval(interval);

  interval=null;

  round=1;
  mode="work";
  seconds=WORK;
  running=false;

  startButton.textContent=
    "Start";

  celebration.classList.remove(
    "show"
  );

  removeConfetti();

  display();

}


function closeCelebration(){

  celebration.classList.remove(
    "show"
  );

  removeConfetti();

}


function createConfetti(){

  removeConfetti();

  const colors=[
    "#f43f5e",
    "#facc15",
    "#4ade80",
    "#60a5fa",
    "#c084fc",
    "#fb923c",
    "#ffffff"
  ];

  for(let i=0;i<140;i++){

    const piece =
      document.createElement(
        "div"
      );

    piece.className=
      "confetti";

    piece.style.left =
      Math.random()*100+"vw";

    piece.style.background =
      colors[
        Math.floor(
          Math.random()*colors.length
        )
      ];

    piece.style.animationDuration =
      (2.5 + Math.random()*3)+"s";

    piece.style.animationDelay =
      Math.random()*1.5+"s";

    piece.style.width =
      (6+Math.random()*9)+"px";

    piece.style.height =
      (9+Math.random()*14)+"px";

    piece.style.borderRadius =
      Math.random()>.5
      ? "50%"
      : "2px";

    document.body.appendChild(
      piece
    );

  }

}


function removeConfetti(){

  document
    .querySelectorAll(
      ".confetti"
    )
    .forEach(
      item=>item.remove()
    );

}


function extractYouTubeID(url){

  try{

    const parsed =
      new URL(url);

    if(
      parsed.hostname.includes(
        "youtu.be"
      )
    ){

      return parsed.pathname
        .replace("/","")
        .split("?")[0];

    }

    if(
      parsed.searchParams.get("v")
    ){

      return parsed.searchParams
        .get("v");

    }

    const parts =
      parsed.pathname.split("/");

    const embedIndex =
      parts.indexOf("embed");

    if(
      embedIndex !== -1 &&
      parts[embedIndex+1]
    ){

      return parts[
        embedIndex+1
      ];

    }

    const shortsIndex =
      parts.indexOf("shorts");

    if(
      shortsIndex !== -1 &&
      parts[shortsIndex+1]
    ){

      return parts[
        shortsIndex+1
      ];

    }

  }catch(e){}

  return null;

}


function loadYouTube(){

  const input =
    document.getElementById(
      "youtubeURL"
    );

  const id =
    extractYouTubeID(
      input.value.trim()
    );

  if(!id){

    alert(
      "Please paste a valid YouTube link."
    );

    return;

  }

  const player =
    document.getElementById(
      "youtubePlayer"
    );

  player.src =
    "https://www.youtube.com/embed/" +
    id +
    "?playsinline=1&rel=0";

  localStorage.setItem(
    "that2minutes_youtube",
    input.value.trim()
  );

}


function saveExerciseNames(){

  ["e1","e2","e3"]
  .forEach(id=>{

    localStorage.setItem(
      "that2minutes_"+id,
      document.getElementById(id).value
    );

  });

}


function restoreSettings(){

  ["e1","e2","e3"]
  .forEach(id=>{

    const saved =
      localStorage.getItem(
        "that2minutes_"+id
      );

    if(saved){

      document.getElementById(id)
        .value=saved;

    }

  });

  const youtube =
    localStorage.getItem(
      "that2minutes_youtube"
    );

  if(youtube){

    document.getElementById(
      "youtubeURL"
    ).value=youtube;

    const id =
      extractYouTubeID(youtube);

    if(id){

      document.getElementById(
        "youtubePlayer"
      ).src =
        "https://www.youtube.com/embed/" +
        id +
        "?playsinline=1&rel=0";

    }

  }

}


["e1","e2","e3"]
.forEach(id=>{

  document
    .getElementById(id)
    .addEventListener(
      "input",
      ()=>{

        saveExerciseNames();
        display();

      }
    );

});


restoreSettings();
display();

</script>

</body>
</html>
